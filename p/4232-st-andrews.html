  <!-- ────────── HERO ──────────
       Carousel of 3 wide hero-worthy photos that crossfade every
       6.5s with a slow Ken Burns zoom on each. Tight interior
       close-ups (piano legs, herringbone floor) are intentionally
       skipped — they don't read as hero, the address title gets
       lost against the busy detail. Property identity (address,
       beds/baths/sqft, asking price) overlays the bottom. ────── -->
  <section class="hero" id="top">
    <div class="hero-slides">
      <div class="hero-slide"><img src="/assets/4232-st-andrews/IMG_0754.webp" alt="4232 St Andrews — Mediterranean front exterior" /></div>
      <div class="hero-slide"><img src="/assets/4232-st-andrews/IMG_0721.webp" alt="4232 St Andrews — primary suite" /></div>
      <div class="hero-slide"><img src="/assets/4232-st-andrews/IMG_0642.webp" alt="4232 St Andrews — great room" /></div>
    </div>
    <div class="hero-overlay">
      <div class="hero-content">
        <div class="hero-eyebrow">Las Colinas, Texas</div>
        <h1 class="hero-title">4232 St Andrews<br />Boulevard</h1>
        <div class="hero-meta">
          <span>4 Beds</span>
          <span class="hero-meta-divider"></span>
          <span>4.5 Baths</span>
          <span class="hero-meta-divider"></span>
          <span>3,825 sqft</span>
        </div>
        <div class="hero-price">$1,495,000</div>
      </div>
    </div>
    <a class="hero-scroll" href="#gallery">Scroll</a>
  </section>
