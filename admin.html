<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Roomify · Founder Dashboard</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
  <style>
    :root {
      --bg: #0A0A0A;
      --bg-soft: #131313;
      --panel: #171717;
      --card: #1b1b1b;
      --card-hover: #202020;
      --ink: #fafafa;
      --ink-soft: #c6c2be;
      --ink-muted: #7c7670;
      --line: rgba(255,255,255,0.08);
      --line-strong: rgba(255,255,255,0.14);
      --accent: #c8b078;
      --success: #5ce0a6;
      --warning: #e0b15c;
      --danger: #ef6464;
      --sidebar-w: 248px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    button { font-family: inherit; cursor: pointer; border: none; }

    /* ─── Sign-in gate ─── */
    .auth-wrap { max-width: 400px; margin: 96px auto; padding: 0 24px; }
    .auth-brand { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 32px; }
    .auth-brand img { width: 24px; height: 24px; }
    .auth-brand span { font-size: 13px; letter-spacing: 0.34em; font-weight: 500; }
    .auth-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 36px 30px; }
    .auth-title { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 6px; }
    .auth-sub { font-size: 13px; color: var(--ink-muted); margin-bottom: 26px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 7px; }
    .field input {
      width: 100%; background: rgba(255,255,255,0.03); border: 1px solid var(--line);
      color: var(--ink); padding: 12px 14px; border-radius: 10px; font-size: 15px; outline: none;
      transition: border-color 0.15s;
    }
    .field input:focus { border-color: var(--accent); }
    .btn-primary {
      width: 100%; background: var(--ink); color: var(--bg); padding: 13px; border-radius: 10px;
      font-weight: 600; font-size: 15px; margin-top: 6px; transition: opacity 0.15s;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .auth-error { color: var(--danger); font-size: 13px; margin-top: 14px; text-align: center; }

    /* ─── App shell ─── */
    .shell { display: flex; min-height: 100vh; }
    .sidebar {
      width: var(--sidebar-w); flex-shrink: 0; background: var(--bg-soft);
      border-right: 1px solid var(--line); display: flex; flex-direction: column;
      position: sticky; top: 0; height: 100vh; padding: 20px 14px;
    }
    .sb-brand { display: flex; align-items: center; gap: 10px; padding: 8px 10px 22px; }
    .sb-brand img { width: 22px; height: 22px; }
    .sb-brand span { font-size: 12px; letter-spacing: 0.28em; font-weight: 600; }
    .sb-section-label { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-muted); padding: 14px 12px 6px; }
    .nav-item {
      display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
      padding: 9px 12px; border-radius: 8px; background: transparent; color: var(--ink-soft);
      font-size: 14px; font-weight: 500; transition: background 0.12s, color 0.12s;
    }
    .nav-item:hover { background: rgba(255,255,255,0.05); color: var(--ink); }
    .nav-item.active { background: rgba(255,255,255,0.08); color: var(--ink); }
    .nav-item .ic { width: 17px; height: 17px; opacity: 0.8; flex-shrink: 0; }
    .sb-foot { margin-top: auto; padding: 12px; border-top: 1px solid var(--line); }
    .sb-email { font-size: 12px; color: var(--ink-muted); margin-bottom: 10px; word-break: break-all; }
    .sb-signout {
      width: 100%; background: transparent; border: 1px solid var(--line-strong); color: var(--ink-soft);
      padding: 8px; border-radius: 8px; font-size: 12px; letter-spacing: 0.05em; transition: background 0.15s;
    }
    .sb-signout:hover { background: rgba(255,255,255,0.06); color: var(--ink); }

    .main { flex: 1; min-width: 0; padding: 32px 40px 80px; max-width: 1100px; }
    .main-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 28px; gap: 20px; flex-wrap: wrap; }
    .main-title { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
    .main-sub { font-size: 13px; color: var(--ink-muted); margin-top: 4px; }
    .refresh-btn {
      background: var(--card); border: 1px solid var(--line-strong); color: var(--ink-soft);
      padding: 9px 16px; border-radius: 999px; font-size: 13px; font-weight: 500; transition: background 0.15s;
    }
    .refresh-btn:hover { background: var(--card-hover); color: var(--ink); }

    /* ─── Stat cards ─── */
    .grid { display: grid; gap: 14px; }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-2 { grid-template-columns: repeat(2, 1fr); }
    .stat {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px;
    }
    .stat-label { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-muted); }
    .stat-value { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; margin-top: 10px; }
    .stat-value.accent { color: var(--accent); }
    .stat-value.success { color: var(--success); }
    .stat-sub { font-size: 12px; color: var(--ink-muted); margin-top: 6px; }

    .section-label { font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-muted); margin: 34px 0 14px; }

    /* ─── Tables ─── */
    .tbl { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    .tbl th { text-align: left; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-muted); font-weight: 500; padding: 13px 18px; border-bottom: 1px solid var(--line); }
    .tbl td { padding: 13px 18px; font-size: 14px; border-bottom: 1px solid var(--line); color: var(--ink-soft); }
    .tbl tr:last-child td { border-bottom: none; }
    .tbl td.mono { font-variant-numeric: tabular-nums; }
    .tbl td.amt { color: var(--success); font-weight: 600; }

    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 11px; letter-spacing: 0.06em; }
    .pill.ok { background: rgba(92,224,166,0.14); color: var(--success); }
    .pill.warn { background: rgba(224,177,92,0.14); color: var(--warning); }
    .pill.off { background: rgba(255,255,255,0.06); color: var(--ink-muted); }
    .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    .est-note { font-size: 12px; color: var(--ink-muted); margin-top: 10px; font-style: italic; }
    .empty-row { color: var(--ink-muted); font-style: italic; }
    .loading { color: var(--ink-muted); padding: 40px 0; text-align: center; }

    @media (max-width: 820px) {
      .sidebar { display: none; }
      .main { padding: 24px 18px 80px; }
      .grid-3, .grid-2 { grid-template-columns: 1fr; }
      .mobile-nav { display: flex; }
    }
    .mobile-nav { display: none; gap: 8px; overflow-x: auto; padding-bottom: 14px; margin-bottom: 8px; }
    .mobile-nav .nav-item { width: auto; white-space: nowrap; border: 1px solid var(--line); }
  </style>
</head>
<body>

  <!-- Watchdog: if the ES module below fails to load (CDN blocked,
       network hiccup), neither screen ever un-hides and the user
       just sees a black page. After 2.5s with nothing shown, reveal
       the sign-in form so the page is never blank. The module clears
       this flag the moment it boots. -->
  <script>
    window.__roomifyBooted = false;
    setTimeout(function () {
      if (window.__roomifyBooted) return;
      var a = document.getElementById('authScreen');
      var err = document.getElementById('bootError');
      if (a) a.style.display = 'block';
      if (err) err.style.display = 'block';
    }, 2500);
  </script>

  <!-- ─── auth gate ─── -->
  <main id="authScreen" class="auth-wrap" style="display:none">
    <div class="auth-brand">
      <img src="/assets/logo-white.png" alt="" />
      <span>ROOMIFY</span>
    </div>
    <div class="auth-card">
      <h1 class="auth-title">Founder dashboard</h1>
      <p class="auth-sub">Admin access only.</p>
      <form id="signInForm">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" required />
        </div>
        <button class="btn-primary" id="signInBtn" type="submit">Sign in</button>
        <div class="auth-error" id="authError" style="display:none"></div>
      </form>
      <div class="auth-error" id="bootError" style="display:none; margin-top:18px;">
        Couldn’t load the dashboard engine. Check your connection and refresh.
      </div>
    </div>
  </main>

  <!-- ─── dashboard ─── -->
  <div id="shell" class="shell" style="display:none">
    <aside class="sidebar">
      <div class="sb-brand">
        <img src="/assets/logo-white.png" alt="" />
        <span>ROOMIFY</span>
      </div>
      <div class="sb-section-label">Dashboard</div>
      <nav id="nav"></nav>
      <div class="sb-foot">
        <div class="sb-email" id="sbEmail"></div>
        <button class="sb-signout" id="signOutBtn">Sign out</button>
      </div>
    </aside>
    <main class="main">
      <div class="mobile-nav" id="mobileNav"></div>
      <div class="main-head">
        <div>
          <div class="main-title" id="sectionTitle">Overview</div>
          <div class="main-sub" id="sectionSub"></div>
        </div>
        <button class="refresh-btn" id="refreshBtn">↻ Refresh</button>
      </div>
      <div id="content"><div class="loading">Loading metrics…</div></div>
    </main>
  </div>

  <script>
    // No SDK / CDN import — the property-page CSP (script-src 'self')
    // would block any external <script>, and that fight isn't worth
    // it. We hit Supabase's REST + Auth endpoints directly with
    // fetch(), which CSP's connect-src https: already permits. Zero
    // external script dependencies → the dashboard loads under any
    // policy.
    window.__roomifyBooted = true;
    const SUPABASE_URL = 'https://biljpbkwkeztjtrbynkf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJpbGpwYmt3a2V6dGp0cmJ5bmtmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1NzMxODcsImV4cCI6MjA5NTE0OTE4N30.Lf0P1w8iW2LLfwomQkNttsUSUqEvQ2Yt3l0BlaTMKKg';
    const TOKEN_KEY = 'roomify.admin.token.v1';
    const $ = (s) => document.querySelector(s);

    // ─── tiny Supabase auth/REST layer over fetch ───
    async function authSignIn(email, password) {
      const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
        method: 'POST',
        headers: { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const j = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(j.error_description || j.msg || j.message || 'Sign-in failed');
      localStorage.setItem(TOKEN_KEY, j.access_token);
      return j;
    }
    function authToken() { return localStorage.getItem(TOKEN_KEY); }
    function authSignOut() { localStorage.removeItem(TOKEN_KEY); }
    async function authUserEmail() {
      const token = authToken();
      if (!token) return null;
      const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${token}` },
      });
      if (!res.ok) { authSignOut(); return null; }
      const j = await res.json().catch(() => ({}));
      return j.email ?? null;
    }

    let metrics = null;
    let activeSection = 'overview';

    const SECTIONS = [
      { id: 'overview', label: 'Overview', sub: 'The whole business at a glance' },
      { id: 'revenue', label: 'Revenue', sub: 'Apple IAP + domain sales' },
      { id: 'users', label: 'Users', sub: 'Signups and paying customers' },
      { id: 'usage', label: 'AI usage', sub: 'OpenAI calls and estimated spend' },
      { id: 'domains', label: 'Domains', sub: 'Registered domains + Vercel' },
    ];

    // ─── money/format helpers ───
    const usd = (cents) => '$' + ((cents ?? 0) / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const usd0 = (cents) => '$' + Math.round((cents ?? 0) / 100).toLocaleString('en-US');
    const num = (n) => (n ?? 0).toLocaleString('en-US');
    const dateStr = (s) => s ? new Date(s).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';

    function setBusy(busy) {
      $('#signInBtn').disabled = busy;
      $('#signInBtn').textContent = busy ? 'Signing in…' : 'Sign in';
    }
    function showAuthError(m) { $('#authError').textContent = m; $('#authError').style.display = 'block'; }

    async function loadMetrics() {
      const token = authToken();
      if (!token) { showSignIn(); return; }
      $('#content').innerHTML = '<div class="loading">Loading metrics…</div>';
      const res = await fetch(`${SUPABASE_URL}/functions/v1/admin-metrics`, {
        headers: { Authorization: `Bearer ${token}`, apikey: SUPABASE_ANON_KEY },
      });
      if (res.status === 403) {
        $('#content').innerHTML = '<div class="loading">This account isn’t the admin. Sign out and use the founder account.</div>';
        return;
      }
      if (!res.ok) {
        $('#content').innerHTML = `<div class="loading">Couldn’t load metrics (${res.status}).</div>`;
        return;
      }
      metrics = await res.json();
      render();
    }

    function buildNav() {
      const nav = $('#nav');
      const mnav = $('#mobileNav');
      nav.innerHTML = ''; mnav.innerHTML = '';
      for (const s of SECTIONS) {
        for (const target of [nav, mnav]) {
          const btn = document.createElement('button');
          btn.className = 'nav-item' + (s.id === activeSection ? ' active' : '');
          btn.textContent = s.label;
          btn.onclick = () => { activeSection = s.id; buildNav(); render(); };
          target.appendChild(btn);
        }
      }
    }

    function render() {
      const sec = SECTIONS.find((s) => s.id === activeSection);
      $('#sectionTitle').textContent = sec.label;
      $('#sectionSub').textContent = metrics?.db?.generated_at
        ? `Updated ${new Date(metrics.db.generated_at).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })}`
        : sec.sub;
      if (!metrics) return;
      const c = $('#content');
      if (activeSection === 'overview') c.innerHTML = renderOverview();
      else if (activeSection === 'revenue') c.innerHTML = renderRevenue();
      else if (activeSection === 'users') c.innerHTML = renderUsers();
      else if (activeSection === 'usage') c.innerHTML = renderUsage();
      else if (activeSection === 'domains') c.innerHTML = renderDomains();
    }

    function statCard(label, value, sub, cls = '') {
      return `<div class="stat"><div class="stat-label">${label}</div><div class="stat-value ${cls}">${value}</div>${sub ? `<div class="stat-sub">${sub}</div>` : ''}</div>`;
    }

    function renderOverview() {
      const r = metrics.db.revenue, u = metrics.db.users, us = metrics.db.usage, ct = metrics.db.content;
      const iapNet = (r.iap_gross_cents ?? 0) - (r.iap_refunded_cents ?? 0);
      const totalRev = iapNet + (r.domain_gross_cents ?? 0);
      return `
        <div class="grid grid-3">
          ${statCard('Total revenue', usd0(totalRev), `${num(r.iap_grant_count)} unlocks + ${num(r.domain_count)} domains`, 'success')}
          ${statCard('Total users', num(u.total), `${num(u.new_30d)} new in 30d`)}
          ${statCard('Photos roomified', num(us.openai_calls), `${num(us.openai_calls_30d)} in 30d`, 'accent')}
        </div>
        <div class="section-label">This month</div>
        <div class="grid grid-3">
          ${statCard('IAP revenue (gross)', usd0(r.iap_gross_cents_30d), 'last 30 days')}
          ${statCard('Published websites', num(ct.published_websites), `${num(ct.published_30d)} in 30d`)}
          ${statCard('Domains registered', num(r.domain_count), usd0(r.domain_gross_cents) + ' lifetime')}
        </div>
        <div class="section-label">Integrations</div>
        ${renderIntegrationRow()}
      `;
    }

    function renderIntegrationRow() {
      const s = metrics.stripe, v = metrics.vercel;
      const pill = (ok, txt) => `<span class="pill ${ok ? 'ok' : 'off'}"><span class="dot"></span>${txt}</span>`;
      return `<table class="tbl">
        <tr><td>Stripe (domain payments)</td><td style="text-align:right">${s.ok ? pill(true, 'Connected · ' + usd(s.availableCents) + ' available') : pill(false, 'Error: ' + (s.reason || 'unknown'))}</td></tr>
        <tr><td>Vercel (custom domains)</td><td style="text-align:right">${v.ok ? pill(v.domainCount < 45, v.domainCount + ' / 50 domains') : pill(false, 'Error: ' + (v.reason || 'unknown'))}</td></tr>
        <tr><td>Supabase (database)</td><td style="text-align:right">${pill(true, 'Connected')}</td></tr>
        <tr><td>OpenAI (roomify engine)</td><td style="text-align:right">${pill(true, '~' + usd0(metrics.openaiEstCents) + ' est. lifetime')}</td></tr>
      </table>
      ${v.ok && v.domainCount >= 45 ? '<div class="est-note">⚠ Approaching Vercel Hobby 50-domain cap — upgrade to Pro soon.</div>' : ''}`;
    }

    function renderRevenue() {
      const r = metrics.db.revenue, s = metrics.stripe;
      const iapNet = (r.iap_gross_cents ?? 0) - (r.iap_refunded_cents ?? 0);
      const grants = metrics.db.recent_grants || [];
      return `
        <div class="grid grid-3">
          ${statCard('IAP gross', usd0(r.iap_gross_cents), `${num(r.iap_grant_count)} purchases`, 'success')}
          ${statCard('IAP refunded', usd0(r.iap_refunded_cents), 'lifetime')}
          ${statCard('IAP net', usd0(iapNet), 'after refunds')}
        </div>
        <div class="grid grid-2" style="margin-top:14px">
          ${statCard('Domain sales', usd0(r.domain_gross_cents), `${num(r.domain_count)} domains @ $19`)}
          ${statCard('Stripe balance', s.ok ? usd(s.availableCents) : '—', s.ok ? usd(s.pendingCents) + ' pending' : 'unavailable')}
        </div>
        <div class="section-label">Recent IAP purchases</div>
        <table class="tbl">
          <thead><tr><th>Date</th><th>Amount</th><th>Reason</th></tr></thead>
          <tbody>
            ${grants.length ? grants.map((g) => `<tr><td class="mono">${dateStr(g.created_at)}</td><td class="amt">${usd(g.amount_cents)}</td><td>${(g.reason || '').replace(/</g,'&lt;')}</td></tr>`).join('') : '<tr><td colspan="3" class="empty-row">No purchases yet.</td></tr>'}
          </tbody>
        </table>
        <div class="est-note">Apple takes ~15–30% of IAP; figures above are gross (pre-Apple-cut). Domain sales run through Stripe.</div>
      `;
    }

    function renderUsers() {
      const u = metrics.db.users;
      return `
        <div class="grid grid-3">
          ${statCard('Total users', num(u.total), 'all-time signups')}
          ${statCard('Paying users', num(u.paying), 'made ≥1 purchase', 'success')}
          ${statCard('Active balance', num(u.with_balance), 'have unused ops')}
        </div>
        <div class="grid grid-2" style="margin-top:14px">
          ${statCard('New (7 days)', num(u.new_7d), '')}
          ${statCard('New (30 days)', num(u.new_30d), '')}
        </div>
        <div class="est-note">Conversion: ${u.total ? Math.round((u.paying / u.total) * 100) : 0}% of users have paid at least once.</div>
      `;
    }

    function renderUsage() {
      const us = metrics.db.usage;
      return `
        <div class="grid grid-3">
          ${statCard('OpenAI calls (all)', num(us.openai_calls), 'photos roomified', 'accent')}
          ${statCard('Calls (30d)', num(us.openai_calls_30d), '')}
          ${statCard('Calls (today)', num(us.openai_calls_today), '')}
        </div>
        <div class="grid grid-2" style="margin-top:14px">
          ${statCard('Est. OpenAI spend', '~' + usd0(metrics.openaiEstCents), `@ ~$${(metrics.estCentsPerImage/100).toFixed(2)}/image`)}
          ${statCard('Failed-call refunds', num(us.refunds_issued), 'ops auto-restored')}
        </div>
        <div class="est-note">Spend is an estimate (calls × per-image rate). Real billing: platform.openai.com/usage.</div>
      `;
    }

    function renderDomains() {
      const r = metrics.db.revenue, v = metrics.vercel;
      const doms = metrics.db.recent_domains || [];
      return `
        <div class="grid grid-2">
          ${statCard('Registered domains', num(r.domain_count), usd0(r.domain_gross_cents) + ' in sales', 'success')}
          ${statCard('Vercel domains', v.ok ? num(v.domainCount) + ' / 50' : '—', v.ok ? 'Hobby plan cap' : 'unavailable')}
        </div>
        <div class="section-label">Registered domains</div>
        <table class="tbl">
          <thead><tr><th>Domain</th><th>Registered</th><th>Expires</th></tr></thead>
          <tbody>
            ${doms.length ? doms.map((d) => `<tr><td>${(d.domain||'').replace(/</g,'&lt;')}</td><td class="mono">${dateStr(d.registered_at)}</td><td class="mono">${dateStr(d.expires_at)}</td></tr>`).join('') : '<tr><td colspan="3" class="empty-row">No domains registered yet.</td></tr>'}
          </tbody>
        </table>
      `;
    }

    // ─── auth flow ───
    function showSignIn() { $('#authScreen').style.display = 'block'; $('#shell').style.display = 'none'; }
    function showDashboard(email) {
      $('#authScreen').style.display = 'none';
      $('#shell').style.display = 'flex';
      $('#sbEmail').textContent = email;
      buildNav();
      loadMetrics();
    }

    $('#signInForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('#authError').style.display = 'none';
      setBusy(true);
      try {
        const session = await authSignIn($('#email').value.trim(), $('#password').value);
        showDashboard(session.user?.email ?? $('#email').value.trim());
      } catch (err) {
        showAuthError(err.message || 'Sign-in failed');
      } finally {
        setBusy(false);
      }
    });
    $('#signOutBtn').addEventListener('click', () => { authSignOut(); metrics = null; showSignIn(); });
    $('#refreshBtn').addEventListener('click', loadMetrics);

    // On load: if we have a stored token, verify it resolves to a
    // user before showing the dashboard (the email gate is enforced
    // server-side by admin-metrics anyway).
    (async () => {
      const email = await authUserEmail();
      if (email) showDashboard(email);
      else showSignIn();
    })();
  </script>
</body>
</html>
