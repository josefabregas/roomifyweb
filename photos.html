<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Your photos — Roomify</title>
  <meta name="description" content="View and download every Roomified photo from your listings." />
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0A0A0A;
      --bg-soft: #141414;
      --card: #1a1a1a;
      --card-hover: #1f1f1f;
      --ink: #fafafa;
      --ink-soft: #c8c4c0;
      --ink-muted: #7a7470;
      --line: rgba(255, 255, 255, 0.08);
      --line-strong: rgba(255, 255, 255, 0.14);
      --accent: #c8b078;
      --success: #5ce0a6;
      --danger: #ef6464;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    /* Body font mirrors the iPhone app (Helvetica Neue) — falls
       back to system sans on platforms that don't ship it. */
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.55;
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    button { font-family: inherit; cursor: pointer; border: none; }

    /* ─── NAV: matches marketing-site index.html — small logo + ROOMIFY wordmark ─── */
    .nav {
      position: sticky; top: 0; z-index: 50;
      padding: 18px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      background: rgba(10, 10, 10, 0.85);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--line);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      letter-spacing: 0.34em;
      font-weight: 500;
      color: var(--ink);
    }
    .brand img { width: 22px; height: 22px; }
    .nav-meta {
      flex: 1;
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }
    .nav-signout {
      background: transparent;
      border: 1px solid var(--line-strong);
      color: var(--ink-soft);
      padding: 9px 18px;
      border-radius: 999px;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }
    .nav-signout:hover { background: rgba(255,255,255,0.06); color: var(--ink); border-color: rgba(255,255,255,0.24); }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 32px 96px;
    }

    /* ─── Page-level intro ─── */
    .page-intro {
      padding: 24px 0 40px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
    }
    .page-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 500;
      font-size: 48px;
      letter-spacing: -0.015em;
      line-height: 1.05;
    }
    .page-sub {
      font-size: 13px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }

    /* ─── Sign-in ─── */
    .auth-wrap {
      max-width: 420px;
      margin: 80px auto;
      padding: 0 24px;
    }
    .auth-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 36px;
      color: var(--ink);
    }
    .auth-brand img { width: 22px; height: 22px; }
    .auth-brand-text {
      font-size: 13px;
      letter-spacing: 0.34em;
      font-weight: 500;
    }
    .auth-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 40px 32px;
    }
    .auth-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 34px;
      font-weight: 500;
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }
    .auth-sub {
      font-size: 14px;
      color: var(--ink-soft);
      margin-bottom: 28px;
    }
    .field {
      display: block;
      margin-bottom: 16px;
    }
    .field label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 8px;
    }
    .field input {
      width: 100%;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--line);
      color: var(--ink);
      padding: 14px 16px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 15px;
      outline: none;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .field input:focus { border-color: var(--accent); background: rgba(255,255,255,0.05); }
    .btn-primary {
      width: 100%;
      background: var(--ink);
      color: var(--bg);
      padding: 15px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.02em;
      margin-top: 8px;
      transition: opacity 0.15s ease;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .auth-error {
      color: var(--danger);
      font-size: 13px;
      margin-top: 14px;
      text-align: center;
    }
    .auth-note {
      margin-top: 24px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
      font-size: 12px;
      color: var(--ink-muted);
      text-align: center;
      line-height: 1.6;
    }

    /* ─── Empty state ─── */
    .empty {
      text-align: center;
      padding: 96px 24px;
      color: var(--ink-muted);
    }
    .empty-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 28px;
      font-weight: 500;
      color: var(--ink-soft);
      margin-bottom: 12px;
    }

    /* ─── Listing card (mirrors the iPhone app's listing card aesthetic) ─── */
    .listings {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .listing {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      transition: border-color 0.15s ease;
    }
    .listing:hover { border-color: var(--line-strong); }
    .listing-hero {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 2px;
      background: var(--bg-soft);
      aspect-ratio: 16 / 5;
      overflow: hidden;
    }
    .listing-hero .hero-tile {
      background: var(--bg-soft);
      overflow: hidden;
      position: relative;
    }
    .listing-hero .hero-tile img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.5s ease;
    }
    .listing-hero .hero-tile:hover img { transform: scale(1.04); }
    .listing-hero.empty-hero {
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 16 / 5;
      color: var(--ink-muted);
      font-size: 13px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
    .listing-body {
      padding: 22px 26px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .listing-info { min-width: 0; flex: 1; }
    .listing-name {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 28px;
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: -0.01em;
      margin-bottom: 6px;
      color: var(--ink);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .listing-address {
      font-size: 14px;
      color: var(--ink-soft);
    }
    .listing-meta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-soft);
      white-space: nowrap;
    }
    .listing-meta-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--success);
      display: inline-block;
    }
    .listing-meta.pending .listing-meta-dot { background: var(--accent); }

    /* Photo grid inside expanded listing */
    .listing-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      padding: 0 4px 4px;
    }
    .photo-tile {
      position: relative;
      aspect-ratio: 1 / 1;
      background: var(--bg-soft);
      overflow: hidden;
      cursor: zoom-in;
      border-radius: 4px;
    }
    .photo-tile img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.4s ease;
    }
    .photo-tile:hover img { transform: scale(1.05); }
    .pending-state {
      padding: 32px 26px;
      background: rgba(200, 176, 120, 0.06);
      border-top: 1px solid var(--line);
      font-size: 13px;
      color: var(--ink-soft);
      text-align: center;
      letter-spacing: 0.02em;
    }
    .pending-state strong { color: var(--ink); font-weight: 600; }

    /* ─── Lightbox ─── */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.96);
      display: none;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .lightbox.open { display: flex; opacity: 1; }
    .lightbox-img {
      max-width: 92vw;
      max-height: 86vh;
      object-fit: contain;
      border-radius: 4px;
      box-shadow: 0 40px 100px rgba(0,0,0,0.6);
    }
    .lightbox-actions {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
    }
    .lightbox-btn {
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.18);
      color: #fff;
      padding: 10px 24px;
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .lightbox-btn:hover { background: rgba(255,255,255,0.18); }
    .lightbox-close {
      position: absolute;
      top: 18px;
      right: 18px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.18);
      color: #fff;
      width: 44px;
      height: 44px;
      border-radius: 999px;
      font-size: 22px;
      cursor: pointer;
      line-height: 1;
    }

    @media (max-width: 700px) {
      .container { padding: 24px 14px 80px; }
      .page-title { font-size: 36px; }
      .nav { padding: 14px 18px; }
      .brand { font-size: 11px; letter-spacing: 0.28em; }
      .brand img { width: 18px; height: 18px; }
      .nav-meta { display: none; }
      .listing-hero { grid-template-columns: repeat(3, 1fr); aspect-ratio: 16 / 6; }
      .listing-hero .hero-tile:nth-child(4) { display: none; }
      .listing-grid { grid-template-columns: repeat(3, 1fr); }
      .listing-body { padding: 18px 20px 20px; gap: 14px; }
      .listing-name { font-size: 24px; }
    }
  </style>
</head>
<body>

  <!-- ─── nav (only when authed) ─── -->
  <nav class="nav" id="nav" style="display:none">
    <a class="brand" href="/">
      <img src="/assets/logo-white.png" alt="" />
      <span>ROOMIFY</span>
    </a>
    <span class="nav-meta" id="navMeta"></span>
    <button class="nav-signout" id="signOutBtn">Sign out</button>
  </nav>

  <!-- ─── auth ─── -->
  <main id="authScreen" class="auth-wrap" style="display:none">
    <div class="auth-brand">
      <img src="/assets/logo-white.png" alt="" />
      <span class="auth-brand-text">ROOMIFY</span>
    </div>
    <div class="auth-card">
      <h1 class="auth-title">Sign in to view your photos</h1>
      <p class="auth-sub">Same email and password as the Roomify iPhone app.</p>
      <form id="signInForm">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <button class="btn-primary" id="signInBtn" type="submit">Sign in</button>
        <div class="auth-error" id="authError" style="display:none"></div>
      </form>
      <p class="auth-note">
        View + download only. Edits, AI enhancement, and publishing live in the iPhone app.
      </p>
    </div>
  </main>

  <!-- ─── app ─── -->
  <main id="appScreen" class="container" style="display:none">
    <header class="page-intro">
      <h1 class="page-title">Your photos</h1>
      <span class="page-sub" id="totalSummary"></span>
    </header>
    <div id="appBody"></div>
  </main>

  <!-- ─── lightbox ─── -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lbClose" aria-label="Close">&times;</button>
    <img class="lightbox-img" id="lbImg" alt="" />
    <div class="lightbox-actions">
      <button class="lightbox-btn" id="lbDownload">Download</button>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.0';

    const SUPABASE_URL = 'https://biljpbkwkeztjtrbynkf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJpbGpwYmt3a2V6dGp0cmJ5bmtmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1NzMxODcsImV4cCI6MjA5NTE0OTE4N30.Lf0P1w8iW2LLfwomQkNttsUSUqEvQ2Yt3l0BlaTMKKg';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const $ = (s) => document.querySelector(s);
    const navEl = $('#nav');
    const authScreen = $('#authScreen');
    const appScreen = $('#appScreen');
    const appBody = $('#appBody');
    const errorEl = $('#authError');
    const signInBtn = $('#signInBtn');
    const signInForm = $('#signInForm');

    let signedUrlCache = new Map();

    async function signedUrl(path) {
      if (!path) return null;
      if (signedUrlCache.has(path)) return signedUrlCache.get(path);
      const { data, error } = await supabase
        .storage
        .from('user-photos')
        .createSignedUrl(path, 60 * 60 * 24 * 7);
      if (error || !data?.signedUrl) return null;
      signedUrlCache.set(path, data.signedUrl);
      return data.signedUrl;
    }

    function setBusy(busy) {
      signInBtn.disabled = busy;
      signInBtn.textContent = busy ? 'Signing in…' : 'Sign in';
    }
    function showError(msg) { errorEl.textContent = msg; errorEl.style.display = 'block'; }
    function clearError() { errorEl.style.display = 'none'; errorEl.textContent = ''; }
    function escapeHtml(s) {
      return (s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    async function showApp(user) {
      authScreen.style.display = 'none';
      appScreen.style.display = 'block';
      navEl.style.display = 'flex';
      $('#navMeta').textContent = user.email ?? '';

      appBody.innerHTML = '<div class="empty"><div class="empty-title">Loading your photos…</div></div>';

      const [projRes, photoRes] = await Promise.all([
        supabase.from('user_projects').select('*').eq('user_id', user.id).order('updated_at', { ascending: false }),
        supabase.from('user_listing_photos').select('*').eq('user_id', user.id),
      ]);

      if (projRes.error || photoRes.error) {
        appBody.innerHTML = `<div class="empty"><div class="empty-title">Couldn't load your photos</div><div>${projRes.error?.message ?? photoRes.error?.message ?? ''}</div></div>`;
        return;
      }

      const projects = projRes.data ?? [];
      const photos = photoRes.data ?? [];

      if (projects.length === 0) {
        appBody.innerHTML = `
          <div class="empty">
            <div class="empty-title">No listings yet</div>
            <div>Create a listing in the Roomify iPhone app — your photos will appear here.</div>
          </div>`;
        return;
      }

      const byProject = new Map();
      for (const ph of photos) {
        if (!byProject.has(ph.project_id)) byProject.set(ph.project_id, []);
        byProject.get(ph.project_id).push(ph);
      }
      for (const arr of byProject.values()) {
        arr.sort((a, b) => (a.sort_order ?? 0) - (b.sort_order ?? 0));
      }

      // Tally for the header summary
      let totalPhotos = 0;
      let uploadedPhotos = 0;
      for (const ph of photos) {
        totalPhotos += 1;
        if (ph.cloud_enhanced_path || ph.cloud_staged_path || ph.cloud_original_path) {
          uploadedPhotos += 1;
        }
      }
      $('#totalSummary').textContent =
        `${projects.length} listing${projects.length === 1 ? '' : 's'} · ${uploadedPhotos}/${totalPhotos} photos uploaded`;

      const listings = projects.map((p) => {
        const projPhotos = byProject.get(p.id) ?? [];
        const withPaths = projPhotos.filter((ph) =>
          ph.cloud_enhanced_path || ph.cloud_staged_path || ph.cloud_original_path
        );
        const heroPhotos = withPaths.slice(0, 4);
        const heroHtml = heroPhotos.length > 0
          ? `<div class="listing-hero" data-project="${p.id}">${heroPhotos.map((ph) => {
              const path = ph.cloud_enhanced_path || ph.cloud_staged_path || ph.cloud_original_path;
              return `<div class="hero-tile" data-path="${path}"><img loading="lazy" alt="" /></div>`;
            }).join('')}</div>`
          : `<div class="listing-hero empty-hero">Uploading photos · check back soon</div>`;
        const allTiles = withPaths.length > heroPhotos.length
          ? `<div class="listing-grid">${withPaths.map((ph) => {
              const path = ph.cloud_enhanced_path || ph.cloud_staged_path || ph.cloud_original_path;
              return `<div class="photo-tile" data-path="${path}"><img loading="lazy" alt="" /></div>`;
            }).join('')}</div>`
          : '';
        const pendingCount = projPhotos.length - withPaths.length;
        const pendingNote = pendingCount > 0
          ? `<div class="pending-state"><strong>${pendingCount}</strong> photo${pendingCount === 1 ? '' : 's'} still uploading from the iPhone app · check back in a minute</div>`
          : '';
        const status = withPaths.length === projPhotos.length && projPhotos.length > 0 ? 'ready' : 'pending';
        return `
          <section class="listing">
            ${heroHtml}
            <div class="listing-body">
              <div class="listing-info">
                <div class="listing-name">${escapeHtml(p.name || 'Untitled listing')}</div>
                <div class="listing-address">${escapeHtml(p.address || '')}</div>
              </div>
              <div class="listing-meta ${status === 'ready' ? '' : 'pending'}">
                <span class="listing-meta-dot"></span>
                ${withPaths.length} of ${projPhotos.length} photos
              </div>
            </div>
            ${allTiles}
            ${pendingNote}
          </section>`;
      }).join('');

      appBody.innerHTML = `<div class="listings">${listings}</div>`;

      // Lazy-load signed URLs for hero strips + photo grids.
      const tiles = Array.from(document.querySelectorAll('.hero-tile, .photo-tile'));
      for (let i = 0; i < tiles.length; i += 12) {
        const batch = tiles.slice(i, i + 12);
        await Promise.all(batch.map(async (tile) => {
          const path = tile.dataset.path;
          const url = await signedUrl(path);
          if (url) {
            const img = tile.querySelector('img');
            img.src = url;
            tile.addEventListener('click', () => openLightbox(url));
          }
        }));
      }
    }

    // ─── lightbox ─────────────────────────────────────────────
    const lb = $('#lightbox');
    const lbImg = $('#lbImg');
    function openLightbox(url) {
      lbImg.src = url;
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
      lb.classList.remove('open');
      document.body.style.overflow = '';
    }
    $('#lbClose').addEventListener('click', closeLightbox);
    lb.addEventListener('click', (e) => { if (e.target === lb) closeLightbox(); });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && lb.classList.contains('open')) closeLightbox();
    });
    $('#lbDownload').addEventListener('click', async () => {
      const url = lbImg.src;
      try {
        const blob = await (await fetch(url)).blob();
        const objUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = objUrl;
        a.download = `roomify-${Date.now()}.jpg`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(objUrl);
      } catch (e) {
        alert('Download failed. Right-click → Save image.');
      }
    });

    // ─── auth handlers ────────────────────────────────────────
    signInForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();
      setBusy(true);
      const email = $('#email').value.trim();
      const password = $('#password').value;
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      setBusy(false);
      if (error) { showError(error.message); return; }
      if (data?.user) await showApp(data.user);
    });

    $('#signOutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      navEl.style.display = 'none';
      appScreen.style.display = 'none';
      authScreen.style.display = 'block';
      signedUrlCache.clear();
    });

    (async () => {
      const { data } = await supabase.auth.getSession();
      if (data?.session?.user) await showApp(data.session.user);
      else authScreen.style.display = 'block';
    })();
  </script>

</body>
</html>
