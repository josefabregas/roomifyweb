<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Your photos — Roomify</title>
  <meta name="description" content="View and download every Roomified photo from your listings." />
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0A0A0A;
      --bg-soft: #161616;
      --card: #1c1c1c;
      --ink: #fafafa;
      --ink-soft: #c8c4c0;
      --ink-muted: #7a7470;
      --line: rgba(255, 255, 255, 0.08);
      --accent: #c8b078;
      --danger: #ef6464;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.55;
      min-height: 100vh;
    }
    .serif { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    button { font-family: inherit; cursor: pointer; }

    .nav {
      position: sticky; top: 0; z-index: 50;
      padding: 18px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(10, 10, 10, 0.85);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--line);
    }
    .nav-brand {
      display: inline-flex; align-items: baseline; gap: 10px;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 20px; letter-spacing: 0.04em; font-weight: 500;
    }
    .nav-brand-mark {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent);
      display: inline-block;
      margin-right: 6px;
    }
    .nav-meta {
      font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--ink-muted);
    }
    .nav-signout {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--ink-soft);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .nav-signout:hover { background: rgba(255,255,255,0.06); color: var(--ink); }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 48px 32px 96px;
    }

    /* ─── Sign-in ─── */
    .auth-wrap {
      max-width: 420px;
      margin: 80px auto;
      padding: 0 24px;
    }
    .auth-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 40px 32px;
    }
    .auth-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 34px;
      font-weight: 500;
      margin-bottom: 8px;
    }
    .auth-sub {
      font-size: 14px;
      color: var(--ink-soft);
      margin-bottom: 28px;
    }
    .field {
      display: block;
      margin-bottom: 16px;
    }
    .field label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 8px;
    }
    .field input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      color: var(--ink);
      padding: 12px 14px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 15px;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .field input:focus { border-color: var(--accent); }
    .btn-primary {
      width: 100%;
      background: var(--ink);
      color: var(--bg);
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.02em;
      margin-top: 8px;
      transition: transform 0.1s ease, opacity 0.15s ease;
    }
    .btn-primary:active { transform: translateY(1px); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .auth-error {
      color: var(--danger);
      font-size: 13px;
      margin-top: 14px;
      text-align: center;
    }
    .auth-note {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      font-size: 12px;
      color: var(--ink-muted);
      text-align: center;
      line-height: 1.6;
    }

    /* ─── App body ─── */
    .empty {
      text-align: center;
      padding: 96px 24px;
      color: var(--ink-muted);
    }
    .empty-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 28px;
      font-weight: 500;
      color: var(--ink-soft);
      margin-bottom: 12px;
    }

    .listings {
      display: flex;
      flex-direction: column;
      gap: 64px;
      margin-top: 24px;
    }
    .listing {
      border-top: 1px solid var(--line);
      padding-top: 36px;
    }
    .listing-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .listing-name {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 32px;
      font-weight: 500;
      line-height: 1.1;
      letter-spacing: -0.01em;
    }
    .listing-meta {
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .photo-tile {
      position: relative;
      aspect-ratio: 4 / 3;
      background: var(--bg-soft);
      border-radius: 6px;
      overflow: hidden;
      cursor: zoom-in;
    }
    .photo-tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }
    .photo-tile:hover img { transform: scale(1.03); }
    .photo-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 4px 8px;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      background: rgba(0,0,0,0.65);
      color: #fff;
      border-radius: 4px;
      backdrop-filter: blur(6px);
    }
    .photo-badge.staged { background: rgba(200, 176, 120, 0.85); color: #0a0a0a; }
    .photo-badge.enhanced { background: rgba(92, 224, 166, 0.85); color: #0a0a0a; }

    /* ─── Lightbox ─── */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.96);
      display: none;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .lightbox.open { display: flex; opacity: 1; }
    .lightbox-img {
      max-width: 92vw;
      max-height: 86vh;
      object-fit: contain;
      border-radius: 4px;
      box-shadow: 0 40px 100px rgba(0,0,0,0.6);
    }
    .lightbox-actions {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
    }
    .lightbox-btn {
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.18);
      color: #fff;
      padding: 10px 24px;
      border-radius: 999px;
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .lightbox-btn:hover { background: rgba(255,255,255,0.18); }
    .lightbox-close {
      position: absolute;
      top: 18px;
      right: 18px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.18);
      color: #fff;
      width: 44px;
      height: 44px;
      border-radius: 999px;
      font-size: 22px;
      cursor: pointer;
      line-height: 1;
    }

    @media (max-width: 700px) {
      .container { padding: 32px 16px 80px; }
      .listing-name { font-size: 24px; }
      .photo-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .nav { padding: 14px 18px; }
    }
  </style>
</head>
<body>

  <!-- ─── nav, only shown when authed ─── -->
  <nav class="nav" id="nav" style="display:none">
    <a class="nav-brand" href="/">
      <span class="nav-brand-mark"></span>Roomify
    </a>
    <span class="nav-meta" id="navMeta"></span>
    <button class="nav-signout" id="signOutBtn">Sign out</button>
  </nav>

  <!-- ─── auth ─── -->
  <main id="authScreen" class="auth-wrap" style="display:none">
    <div class="auth-card">
      <h1 class="auth-title">Sign in to view your photos</h1>
      <p class="auth-sub">Same email and password you use in the Roomify iPhone app.</p>
      <form id="signInForm">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <button class="btn-primary" id="signInBtn" type="submit">Sign in</button>
        <div class="auth-error" id="authError" style="display:none"></div>
      </form>
      <p class="auth-note">
        This page only shows + downloads your photos. Edits, AI enhancement, and publishing live in the iPhone app.
      </p>
    </div>
  </main>

  <!-- ─── app ─── -->
  <main id="appScreen" class="container" style="display:none">
    <div id="appBody"></div>
  </main>

  <!-- ─── lightbox ─── -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lbClose" aria-label="Close">&times;</button>
    <img class="lightbox-img" id="lbImg" alt="" />
    <div class="lightbox-actions">
      <button class="lightbox-btn" id="lbDownload">Download</button>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.0';

    const SUPABASE_URL = 'https://biljpbkwkeztjtrbynkf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJpbGpwYmt3a2V6dGp0cmJ5bmtmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1NzMxODcsImV4cCI6MjA5NTE0OTE4N30.Lf0P1w8iW2LLfwomQkNttsUSUqEvQ2Yt3l0BlaTMKKg';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const $ = (s) => document.querySelector(s);
    const navEl = $('#nav');
    const authScreen = $('#authScreen');
    const appScreen = $('#appScreen');
    const appBody = $('#appBody');
    const errorEl = $('#authError');
    const signInBtn = $('#signInBtn');
    const signInForm = $('#signInForm');

    let signedUrlCache = new Map();

    async function signedUrl(path) {
      if (!path) return null;
      if (signedUrlCache.has(path)) return signedUrlCache.get(path);
      const { data, error } = await supabase
        .storage
        .from('user-photos')
        .createSignedUrl(path, 60 * 60 * 24 * 7);
      if (error || !data?.signedUrl) return null;
      signedUrlCache.set(path, data.signedUrl);
      return data.signedUrl;
    }

    function setBusy(busy) {
      signInBtn.disabled = busy;
      signInBtn.textContent = busy ? 'Signing in…' : 'Sign in';
    }

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.style.display = 'block';
    }

    function clearError() {
      errorEl.style.display = 'none';
      errorEl.textContent = '';
    }

    async function showApp(user) {
      authScreen.style.display = 'none';
      appScreen.style.display = 'block';
      navEl.style.display = 'flex';
      $('#navMeta').textContent = user.email ?? '';

      appBody.innerHTML = '<div class="empty"><div class="empty-title">Loading your photos…</div></div>';

      const [projRes, photoRes] = await Promise.all([
        supabase.from('user_projects').select('*').eq('user_id', user.id).order('updated_at', { ascending: false }),
        supabase.from('user_listing_photos').select('*').eq('user_id', user.id),
      ]);

      if (projRes.error || photoRes.error) {
        appBody.innerHTML = `<div class="empty"><div class="empty-title">Couldn't load your photos</div><div>${projRes.error?.message ?? photoRes.error?.message ?? ''}</div></div>`;
        return;
      }

      const projects = projRes.data ?? [];
      const photos = photoRes.data ?? [];

      if (projects.length === 0) {
        appBody.innerHTML = `
          <div class="empty">
            <div class="empty-title">No listings yet</div>
            <div>Create a listing in the Roomify iPhone app — your photos will appear here.</div>
          </div>`;
        return;
      }

      // Group photos by project_id, sort by sort_order.
      const byProject = new Map();
      for (const ph of photos) {
        if (!byProject.has(ph.project_id)) byProject.set(ph.project_id, []);
        byProject.get(ph.project_id).push(ph);
      }
      for (const arr of byProject.values()) {
        arr.sort((a, b) => (a.sort_order ?? 0) - (b.sort_order ?? 0));
      }

      const listings = projects.map((p) => {
        const projPhotos = byProject.get(p.id) ?? [];
        const tiles = projPhotos.map((ph) => {
          // Prefer enhanced (roomified) version; fall back to staged
          // (virtual staging), then the original. Most users want
          // to see/download the roomified output.
          const path = ph.cloud_enhanced_path || ph.cloud_staged_path || ph.cloud_original_path;
          if (!path) return ''; // Photo exists but file isn't uploaded yet — skip.
          const label = ph.cloud_enhanced_path ? 'roomified' : ph.cloud_staged_path ? 'staged' : 'original';
          return `<div class="photo-tile" data-path="${path}">
            <img loading="lazy" alt="" data-pending="1" />
            <span class="photo-badge ${label}">${label}</span>
          </div>`;
        }).filter(Boolean).join('');
        return `
          <section class="listing">
            <div class="listing-head">
              <div>
                <div class="listing-name">${escapeHtml(p.name || 'Untitled listing')}</div>
                <div style="font-size:14px;color:var(--ink-soft);margin-top:4px">${escapeHtml(p.address || '')}</div>
              </div>
              <div class="listing-meta">${projPhotos.length} photo${projPhotos.length === 1 ? '' : 's'}</div>
            </div>
            ${tiles ? `<div class="photo-grid">${tiles}</div>` : '<div class="empty" style="padding:32px 0">No photos uploaded yet.</div>'}
          </section>`;
      }).join('');

      appBody.innerHTML = `<div class="listings">${listings}</div>`;

      // Lazy-load signed URLs for the tiles. Doing all-at-once would
      // hammer the storage API; we batch ~12 at a time.
      const pendingTiles = Array.from(document.querySelectorAll('.photo-tile'));
      for (let i = 0; i < pendingTiles.length; i += 12) {
        const batch = pendingTiles.slice(i, i + 12);
        await Promise.all(batch.map(async (tile) => {
          const path = tile.dataset.path;
          const url = await signedUrl(path);
          if (url) {
            const img = tile.querySelector('img');
            img.src = url;
            img.removeAttribute('data-pending');
            tile.addEventListener('click', () => openLightbox(url));
          }
        }));
      }
    }

    function escapeHtml(s) {
      return (s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ─── lightbox ─────────────────────────────────────────────
    const lb = $('#lightbox');
    const lbImg = $('#lbImg');
    function openLightbox(url) {
      lbImg.src = url;
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
      lb.classList.remove('open');
      document.body.style.overflow = '';
    }
    $('#lbClose').addEventListener('click', closeLightbox);
    lb.addEventListener('click', (e) => {
      if (e.target === lb) closeLightbox();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && lb.classList.contains('open')) closeLightbox();
    });
    $('#lbDownload').addEventListener('click', async () => {
      // Force a download by fetching the signed URL as a blob and
      // saving via a temp <a download>. `<a href=signed-url download>`
      // alone won't trigger a download cross-origin without this.
      const url = lbImg.src;
      try {
        const blob = await (await fetch(url)).blob();
        const objUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = objUrl;
        a.download = `roomify-${Date.now()}.jpg`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(objUrl);
      } catch (e) {
        alert('Download failed. Try right-click → Save image.');
      }
    });

    // ─── auth handlers ────────────────────────────────────────
    signInForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();
      setBusy(true);
      const email = $('#email').value.trim();
      const password = $('#password').value;
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      setBusy(false);
      if (error) {
        showError(error.message);
        return;
      }
      if (data?.user) await showApp(data.user);
    });

    $('#signOutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      navEl.style.display = 'none';
      appScreen.style.display = 'none';
      authScreen.style.display = 'block';
      signedUrlCache.clear();
    });

    // On load, if there's a session already, skip the sign-in form.
    (async () => {
      const { data } = await supabase.auth.getSession();
      if (data?.session?.user) {
        await showApp(data.session.user);
      } else {
        authScreen.style.display = 'block';
      }
    })();
  </script>

</body>
</html>
